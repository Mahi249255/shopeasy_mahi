<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - Checkout</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">ShopEasy 🛍️</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="cart.html">Cart</a>
            <a href="orders.html">My Orders</a>
            <a href="admin.html">Admin</a>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <main class="container" style="max-width: 500px; margin-top: 3rem;">
        <h2>Checkout & Shipping Details</h2>
        <form id="checkout-form" style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
            <div style="margin-bottom: 15px;">
                <label>Receiver Name</label><br>
                <input type="text" id="shipping_name" required style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Phone Number</label><br>
                <input type="text" id="shipping_phone" required style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
            <div style="margin-bottom: 15px;">
                <label>Shipping Address</label><br>
                <textarea id="shipping_address" required rows="3" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
            </div>
            <div style="margin-bottom: 15px;">
                <label>Payment Method</label><br>
                <input type="text" value="Cash on Delivery (COD)" disabled style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; background: #eee;">
            </div>
            <button type="submit" class="btn" style="width: 100%;">Place Order</button>
        </form>
    </main>

    <script>
        document.getElementById("checkout-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const token = localStorage.getItem("token");

            const shipping_name = document.getElementById("shipping_name").value;
            const shipping_phone = document.getElementById("shipping_phone").value;
            const shipping_address = document.getElementById("shipping_address").value;

            try {
                const response = await fetch("http://localhost:5000/api/orders", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ shipping_name, shipping_phone, shipping_address })
                });

                const data = await response.json();
                if (response.ok) {
                    alert(`Order placed successfully! Order ID: #${data.orderId}`);
                    window.location.href = "index.html";
                } else {
                    alert(data.error || "Failed to place order.");
                }
            } catch (error) {
                console.error("Error during checkout:", error);
                alert("Network error during checkout.");
            }
        });
    </script>
</body>
</html>
