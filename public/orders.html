<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEasy - My Orders</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">ShopEasy 🛍️</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="cart.html">Cart</a>
            <a href="orders.html" class="active">My Orders</a>
            <a href="admin.html">Admin</a>
            <a href="login.html" id="auth-link">Login</a>
        </nav>
    </header>

    <main class="container">
        <h1>Your Order History</h1>
        <div id="orders-container">
            <p>Loading your orders...</p>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetchOrders();
            checkAuthNav();
        });

        async function fetchOrders() {
            const token = localStorage.getItem("token");
            const container = document.getElementById("orders-container");

            if (!token) {
                container.innerHTML = `<p>Please <a href="login.html">login</a> to view your order history.</p>`;
                return;
            }

            try {
                const response = await fetch("http://localhost:5000/api/orders", {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const data = await response.json();

                if (!data.orders || data.orders.length === 0) {
                    container.innerHTML = `<p>You haven't placed any orders yet. <a href="index.html">Start shopping</a></p>`;
                    return;
                }

                let html = `
                    <table style="width:100%; border-collapse: collapse; background:white; border-radius:8px; overflow:hidden; box-shadow:0 2px 5px rgba(0,0,0,0.05);">
                        <thead>
                            <tr style="background-color: #2c3e50; color: white; text-align: left;">
                                <th style="padding: 12px;">Order ID</th>
                                <th style="padding: 12px;">Date</th>
                                <th style="padding: 12px;">Total Amount</th>
                                <th style="padding: 12px;">Status</th>
                                <th style="padding: 12px;">Shipping Address</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                data.orders.forEach(order => {
                    const totalFormatted = (order.total_amount / 100).toFixed(2);
                    const dateFormatted = new Date(order.created_at).toLocaleDateString();

                    html += `
                        <tr style="border-bottom: 1px solid #eee;">
                            <td style="padding: 12px; font-weight:bold;">#${order.id}</td>
                            <td style="padding: 12px;">${dateFormatted}</td>
                            <td style="padding: 12px; font-weight:bold; color: #e67e22;">₹${totalFormatted}</td>
                            <td style="padding: 12px;"><span style="background: #e1f5fe; color: #0288d1; padding: 4px 8px; border-radius: 4px; font-size: 0.9rem;">${order.status}</span></td>
                            <td style="padding: 12px; font-size: 0.9rem; color: #555;">${order.shipping_address} (${order.shipping_phone})</td>
                        </tr>
                    `;
                });

                html += `
                        </tbody>
                    </table>
                `;

                container.innerHTML = html;
            } catch (error) {
                console.error("Error fetching orders:", error);
                container.innerHTML = `<p>Failed to load your orders.</p>`;
            }
        }

        function checkAuthNav() {
            const token = localStorage.getItem("token");
            const authLink = document.getElementById("auth-link");
            if (token) {
                authLink.textContent = "Logout";
                authLink.href = "#";
                authLink.onclick = () => {
                    localStorage.removeItem("token");
                    localStorage.removeItem("user");
                    alert("Logged out successfully.");
                    window.location.href = "login.html";
                };
            }
        }
    </script>
</body>
</html>
